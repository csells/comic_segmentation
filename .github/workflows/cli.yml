name: comic-panel CLI

on:
  push:
    paths: ["cli/**", "prototypes/panel_quality_probe/*.txt", "prototypes/panel_quality_probe/*.json", ".github/workflows/cli.yml"]
  pull_request:
    paths: ["cli/**", "prototypes/panel_quality_probe/*.txt", "prototypes/panel_quality_probe/*.json", ".github/workflows/cli.yml"]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install build and test tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake nasm libxml2-utils libarchive-tools poppler-utils
      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: command -v cmake || brew install cmake
      - run: cargo fmt --check
      - run: cargo clippy --release --all-targets -- -D warnings
      - name: Fetch pinned ACBF 1.1 schema
        run: tests/fetch-acbf-xsd.sh "$RUNNER_TEMP/acbf-1.1.xsd"
      - name: Test (unit + end-to-end against a fake OpenAI server)
        run: cargo test --release
        env:
          COMIC_PANEL_ACBF_XSD: ${{ runner.temp }}/acbf-1.1.xsd
